plugins {
    id "com.android.application"
}

def releaseKeystore = System.getenv("GBB_ANDROID_KEYSTORE_FILE")
def releaseStorePassword = System.getenv("GBB_ANDROID_KEYSTORE_PASSWORD")
def releaseKeyPassword = System.getenv("GBB_ANDROID_KEY_PASSWORD")
def appVersionName = "0.12.2"
def releaseRef = System.getenv("GITHUB_REF_NAME") ?: ""
if (releaseRef ==~ /v\d+\.\d+\.\d+/) {
    appVersionName = releaseRef.substring(1)
}
def versionParts = appVersionName.tokenize(".").collect { it as int }
def appVersionCode = versionParts[0] * 1000000 +
                     versionParts[1] * 1000 + versionParts[2]

android {
    namespace "com.danielseim.gbb"
    compileSdk 36
    ndkVersion "28.2.13676358"

    defaultConfig {
        applicationId "com.danielseim.gbb"
        minSdk 21
        targetSdk 36
        versionCode appVersionCode
        versionName appVersionName

        externalNativeBuild {
            cmake {
                arguments "-DGAMEBOY_BUILD_TESTS=OFF",
                          "-DGAMEBOY_BUILD_SDL=ON"
                abiFilters "arm64-v8a", "x86_64"
            }
        }
    }

    signingConfigs {
        release {
            if (releaseKeystore && releaseStorePassword && releaseKeyPassword) {
                storeFile file(releaseKeystore)
                storePassword releaseStorePassword
                keyAlias "gbb"
                keyPassword releaseKeyPassword
            }
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix ".debug"
            versionNameSuffix "-debug"
        }
        release {
            minifyEnabled false
            if (releaseKeystore && releaseStorePassword && releaseKeyPassword) {
                signingConfig signingConfigs.release
            }
        }
    }

    buildFeatures {
        prefab true
    }

    externalNativeBuild {
        cmake {
            path file("../../CMakeLists.txt")
            version "3.31.6"
        }
    }
}

dependencies {
    implementation files("libs/SDL3-3.4.2.aar")
}
