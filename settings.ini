# Go Bigger Boy portable settings
# Copy this file beside another GBB installation to share these settings.
# Add an optional second keyboard key after the first, for example: Z Y
# Set emulator shortcut keys to None to disable them.
# Android touch controls use a size multiplier, opacity between 0 and 1, and
# separate normalized portrait and landscape layouts.
# Video.Mode accepts nearest, bilinear, integer, lcd, voxel, voxel_shape, or
# voxel_popup.

palette = grayscale
# Select automatic cartridge detection or an explicit DMG/MGB/SGB/CGB
# hardware revision: auto, dmg0, dmg, mgb, sgb, sgb2, cgb0, cgb-c, cgb-e.
hardware.Model = auto
video.Mode = nearest
# Link.Diagnostics = true writes a per-session serial/CPU/game-state trace.
link.Diagnostics = false
# TCP link defaults to loopback. Set RemoteBind to 0.0.0.0 only when LAN
# hosting is explicitly desired; RemoteHost is used by the joiner.
link.RemoteHost = 127.0.0.1
link.RemoteBind = 127.0.0.1
link.RemotePort = 8765
# LAN discovery is opt-in and uses UDP port 8764 while scanning/hosting.
link.LanDiscovery = false
# Select tcp or bluetooth. Bluetooth uses Classic RFCOMM and the application
# service UUID below; pair devices before starting a host or join session.
link.Transport = tcp
link.BluetoothAddress =
link.BluetoothServiceUuid = 7b8f5d6e-7a47-4e17-9f9d-4b4d9d8e4f3a
# Native plug-ins are never loaded unless explicitly enabled. Plugin.Path may
# be repeated and may name a shared library or a directory to scan.
plugin.Discovery = false
# Optional identity allowlist. Set RequireAllowlist=true to reject every
# discovered plugin whose descriptor core_id is not listed with AllowCore.
plugin.RequireAllowlist = false
# Optional capability permission allowlist. Set RequireCapabilityAllowlist=true
# to reject plugins requesting capabilities not listed with AllowCapability.
plugin.RequireCapabilityAllowlist = false

keyboard.FastForward = Tab
keyboard.Rewind = Left Shift
keyboard.SaveState = F5
keyboard.LoadState = F8

touch.Size = 1.35
touch.Opacity = 0.78
touch.VoxelOrbit = true
touch.MenuPosition = top-left
touch.Portrait.DPad = 0.28 0.71
touch.Portrait.A = 0.77 0.62
touch.Portrait.B = 0.62 0.78
touch.Portrait.Select = 0.40 0.91
touch.Portrait.Start = 0.60 0.91
touch.Landscape.DPad = 0.12 0.50
touch.Landscape.A = 0.88 0.42
touch.Landscape.B = 0.88 0.62
touch.Landscape.Select = 0.42 0.92
touch.Landscape.Start = 0.58 0.92

keyboard.Right = Right
keyboard.Left = Left
keyboard.Up = Up
keyboard.Down = Down
keyboard.A = X
keyboard.B = Z
keyboard.Select = Backspace
keyboard.Start = Return

gamepad.Right = dpad_right
gamepad.Left = dpad_left
gamepad.Up = dpad_up
gamepad.Down = dpad_down
gamepad.A = east
gamepad.B = south
gamepad.Select = back
gamepad.Start = start
