# Go Bigger Boy portable settings
# Copy this file beside another GBB installation to share these settings.
# Add an optional second keyboard key after the first, for example: Z Y
# Set emulator shortcut keys to None to disable them.
# Android touch controls use a size multiplier, opacity between 0 and 1, and
# separate normalized portrait and landscape layouts.
# Video.Mode accepts nearest, bilinear, integer, lcd, voxel, voxel_shape, or
# voxel_popup.

palette = grayscale
video.Mode = nearest
# Link.Diagnostics = true writes a per-session serial/CPU/game-state trace.
link.Diagnostics = false

keyboard.FastForward = Tab
keyboard.Rewind = Left Shift
keyboard.SaveState = F5
keyboard.LoadState = F8

touch.Size = 1.35
touch.Opacity = 0.78
touch.VoxelOrbit = true
touch.MenuPosition = top-left
touch.Portrait.DPad = 0.27 0.82
touch.Portrait.A = 0.74 0.79
touch.Portrait.B = 0.74 0.90
touch.Portrait.Select = 0.43 0.96
touch.Portrait.Start = 0.57 0.96
touch.Landscape.DPad = 0.12 0.50
touch.Landscape.A = 0.88 0.42
touch.Landscape.B = 0.88 0.62
touch.Landscape.Select = 0.42 0.92
touch.Landscape.Start = 0.58 0.92

keyboard.Right = Right
keyboard.Left = Left
keyboard.Up = Up
keyboard.Down = Down
keyboard.A = X
keyboard.B = Z
keyboard.Select = Backspace
keyboard.Start = Return

gamepad.Right = dpad_right
gamepad.Left = dpad_left
gamepad.Up = dpad_up
gamepad.Down = dpad_down
gamepad.A = east
gamepad.B = south
gamepad.Select = back
gamepad.Start = start
