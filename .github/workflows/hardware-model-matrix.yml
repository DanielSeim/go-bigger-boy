name: Hardware model matrix

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: read

jobs:
  matrix:
    name: Per-model ROM matrix
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      TEST_ROMS_URL: https://github.com/c-sp/game-boy-test-roms/releases/download/v7.0/game-boy-test-roms-v7.0.zip
      TEST_ROMS_SHA256: b9a9d7a1075aa35a3d07c07c34974048672d8520dca9e07a50178f5860c3832c
    steps:
      - name: Check out source
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1

      - name: Download pinned test ROM bundle
        run: curl --fail --location --retry 5 --retry-all-errors --retry-delay 2 --retry-max-time 120 --connect-timeout 20 --max-time 300 "$TEST_ROMS_URL" --output test-roms.zip

      - name: Verify test ROM bundle
        run: echo "$TEST_ROMS_SHA256  test-roms.zip" | sha256sum --check -

      - name: Extract test ROM bundle
        run: unzip -q test-roms.zip -d test-roms

      - name: Configure hardware model matrix
        run: >-
          cmake -S . -B build-model-matrix
          -DCMAKE_BUILD_TYPE=Release
          -DGAMEBOY_BUILD_TESTS=ON
          -DGAMEBOY_BUILD_SDL=OFF
          -DGAMEBOY_TEST_ROM_DIR="$PWD/test-roms"
          -DGAMEBOY_ENABLE_MODEL_MATRIX=ON

      - name: Build matrix runner
        run: cmake --build build-model-matrix --target gameboy_test_runner --parallel

      - name: Run hardware model matrix regression gate
        id: model-matrix
        shell: bash
        run: |
          set +e
          ctest --test-dir build-model-matrix -C Release \
            --label-regex model-matrix \
            --output-on-failure \
            --output-junit model-matrix-ctest.xml
          status=$?
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          if [ "$status" -ne 0 ]; then
            echo "::error::Hardware model matrix reported an unexpected regression (exit $status)."
          fi
          exit "$status"

      - name: Add matrix summary
        if: always()
        run: |
          report=build-model-matrix/hardware-model-matrix.md
          if [ -f "$report" ]; then
            {
              echo '### Hardware model matrix'
              echo
              sed -n '/^## Summary$/,/^## Compact results$/p' "$report" | head -n 4
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          echo >> "$GITHUB_STEP_SUMMARY"
          echo "Unexpected regressions fail this job; expected and reviewed known failures remain classified in the report." >> "$GITHUB_STEP_SUMMARY"
          echo "Matrix ctest exit code: ${{ steps.model-matrix.outputs.exit_code || 'not recorded' }}" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload hardware model matrix report
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: hardware-model-matrix
          path: |
            build-model-matrix/hardware-model-matrix.md
            model-matrix-ctest.xml
          if-no-files-found: warn
          retention-days: 14
