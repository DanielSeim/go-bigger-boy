name: Private ROM regression

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

# Each trigger must reach the private durable queue. No public concurrency group:
# GitHub's default single pending slot can replace a waiting validation request.
jobs:
  private-regression:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment: private-rom-trigger
    timeout-minutes: 240
    steps:
      - name: Checkout validation client
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - name: Validate private ROM regression
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GBB_PRIVATE_ACTIONS_TOKEN }}
          PUBLIC_TOKEN: ${{ github.token }}
          GBB_COMMIT: ${{ github.sha }}
          CORRELATION_ID: ${{ github.repository_id }}-${{ github.run_id }}
        run: |
          set -euo pipefail
          python3 scripts/private_rom_validation.py \
            --commit "$GBB_COMMIT" --correlation "$CORRELATION_ID" \
            --state-file "$RUNNER_TEMP/private-rom-dispatch-$CORRELATION_ID.json"
