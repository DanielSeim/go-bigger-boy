name: Android build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: go-bigger-boy-android
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android toolchain
        run: >-
          sdkmanager
          "platforms;android-36"
          "build-tools;35.0.0"
          "ndk;28.2.13676358"
          "cmake;3.31.6"

      - name: Fetch pinned SDL3 Android archive
        run: android/fetch-sdl.sh

      - name: Build debug APK
        if: github.event_name == 'pull_request'
        run: scripts/build-android.sh debug

      - name: Restore release signing key
        if: github.event_name != 'pull_request'
        working-directory: android
        env:
          GBB_ANDROID_KEYSTORE_BASE64: ${{ secrets.GBB_ANDROID_KEYSTORE_BASE64 }}
          GBB_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.GBB_ANDROID_KEYSTORE_PASSWORD }}
          GBB_ANDROID_KEY_PASSWORD: ${{ secrets.GBB_ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$GBB_ANDROID_KEYSTORE_BASE64"
          test -n "$GBB_ANDROID_KEYSTORE_PASSWORD"
          test -n "$GBB_ANDROID_KEY_PASSWORD"
          umask 077
          printf '%s' "$GBB_ANDROID_KEYSTORE_BASE64" | base64 --decode > app/gbb-release.p12

      - name: Build signed release APK and bundle
        if: github.event_name != 'pull_request'
        env:
          GBB_ANDROID_KEYSTORE_FILE: ${{ github.workspace }}/android/app/gbb-release.p12
          GBB_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.GBB_ANDROID_KEYSTORE_PASSWORD }}
          GBB_ANDROID_KEY_PASSWORD: ${{ secrets.GBB_ANDROID_KEY_PASSWORD }}
        run: scripts/build-android.sh release

      - name: Stage signed release packages
        if: github.event_name != 'pull_request'
        run: |
          mkdir -p android/release
          cp android/app/build/outputs/apk/release/app-release.apk \
             android/release/go-bigger-boy-android.apk
          cp android/app/build/outputs/bundle/release/app-release.aab \
             android/release/go-bigger-boy-android.aab

      - name: Upload debug APK
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: go-bigger-boy-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload signed release packages
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: go-bigger-boy-android
          path: android/release/*
          if-no-files-found: error
          retention-days: 14

  release:
    name: Attach Android packages to release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download signed Android packages
        uses: actions/download-artifact@v8
        with:
          name: go-bigger-boy-android
          path: android-release

      - name: Attach packages to tagged release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in {1..60}; do
            if gh release view "${{ github.ref_name }}" \
                  --repo "${{ github.repository }}" >/dev/null 2>&1; then
              gh release upload "${{ github.ref_name }}" android-release/* \
                --repo "${{ github.repository }}" --clobber
              exit 0
            fi
            sleep 10
          done
          echo "Timed out waiting for the desktop workflow to create the release" >&2
          exit 1
