name: Android build

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: read

jobs:
  build:
    name: go-bigger-boy-android
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out source
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1

      - name: Set up Java
        uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165 # v5.0.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@f236b35da9d031e13b1005234ebe4392ed54c580 # v5.0.0

      - name: Set up Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1
        with:
          packages: platform-tools

      - name: Install Android toolchain
        run: |
          for attempt in 1 2 3; do
            if sdkmanager \
              "platforms;android-36" \
              "build-tools;35.0.0" \
              "ndk;28.2.13676358" \
              "cmake;3.31.6"; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "Android toolchain installation attempt $attempt failed; retrying."
              sleep $((attempt * 10))
            fi
          done
          exit 1

      - name: Build Android native link end-to-end test
        run: >-
          cmake -S . -B build-android-link-e2e
          -DCMAKE_TOOLCHAIN_FILE="$ANDROID_HOME/ndk/28.2.13676358/build/cmake/android.toolchain.cmake"
          -DANDROID_ABI=arm64-v8a
          -DANDROID_PLATFORM=android-21
          -DGAMEBOY_BUILD_TESTS=ON
          -DGAMEBOY_BUILD_SDL=OFF
          && cmake --build build-android-link-e2e
          --target gameboy_link_end_to_end_tests --parallel

      - name: Fetch pinned SDL3 Android archive
        run: android/fetch-sdl.sh

      - name: Run Android settings regression tests
        working-directory: android
        run: |
          for attempt in 1 2 3; do
            if ./gradlew --no-daemon --stacktrace test; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "Gradle test attempt $attempt failed; retrying after a short backoff."
              sleep $((attempt * 10))
            fi
          done
          exit 1

      - name: Build debug APK
        run: scripts/build-android.sh debug

      - name: Enable KVM for Android emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-gbb-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run Android frontend instrumentation smoke
        uses: reactivecircus/android-emulator-runner@4c44018e59b437e86cdfc41da381398f93ed8808 # v2
        env:
          GRADLE_USER_HOME: ${{ github.workspace }}/.cache/gradle
        with:
          api-level: 29
          arch: x86_64
          disable-animations: true
          script: |
            set +e
            mkdir -p android-ci-diagnostics
            test_status=1
            for attempt in 1 2; do
              (cd android && ./gradlew --no-daemon --stacktrace connectedDebugAndroidTest) \
                2>&1 | tee "android-ci-diagnostics/instrumentation-attempt-${attempt}.log"
              test_status=${PIPESTATUS[0]}
              if [ "$test_status" -eq 0 ]; then
                break
              fi
              if [ "$attempt" -lt 2 ]; then
                echo "Instrumentation attempt $attempt failed; retrying once."
                sleep 10
              fi
            done
            timeout 10s adb devices -l > android-ci-diagnostics/adb-devices.txt 2>&1 || true
            timeout 15s adb logcat -d -v threadtime > android-ci-diagnostics/logcat.txt 2>&1 || true
            exit "$test_status"

      - name: Collect Android diagnostics
        if: always()
        run: |
          mkdir -p android-ci-diagnostics
          timeout 10s adb devices -l > android-ci-diagnostics/adb-devices-final.txt 2>&1 || true
          timeout 15s adb logcat -d -v threadtime > android-ci-diagnostics/logcat-final.txt 2>&1 || true
          find android/app/build -maxdepth 6 -type f \
            \( -name '*.xml' -o -name '*.log' \) -print 2>/dev/null | \
            sort | head -n 200 > android-ci-diagnostics/build-files.txt || true

      - name: Upload Android diagnostics
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: android-ci-diagnostics-${{ github.run_id }}
          path: android-ci-diagnostics
          if-no-files-found: ignore
          retention-days: 14

      - name: Restore release signing key
        if: github.event_name != 'pull_request'
        working-directory: android
        env:
          GBB_ANDROID_KEYSTORE_BASE64: ${{ secrets.GBB_ANDROID_KEYSTORE_BASE64 }}
          GBB_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.GBB_ANDROID_KEYSTORE_PASSWORD }}
          GBB_ANDROID_KEY_PASSWORD: ${{ secrets.GBB_ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$GBB_ANDROID_KEYSTORE_BASE64"
          test -n "$GBB_ANDROID_KEYSTORE_PASSWORD"
          test -n "$GBB_ANDROID_KEY_PASSWORD"
          umask 077
          printf '%s' "$GBB_ANDROID_KEYSTORE_BASE64" | base64 --decode > app/gbb-release.p12

      - name: Build signed release APK and bundle
        if: github.event_name != 'pull_request'
        env:
          GBB_ANDROID_KEYSTORE_FILE: ${{ github.workspace }}/android/app/gbb-release.p12
          GBB_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.GBB_ANDROID_KEYSTORE_PASSWORD }}
          GBB_ANDROID_KEY_PASSWORD: ${{ secrets.GBB_ANDROID_KEY_PASSWORD }}
        run: scripts/build-android.sh release

      - name: Stage signed release packages
        if: github.event_name != 'pull_request'
        run: |
          mkdir -p android/release
          cp android/app/build/outputs/apk/release/app-release.apk \
             android/release/go-bigger-boy-android.apk
          cp android/app/build/outputs/bundle/release/app-release.aab \
             android/release/go-bigger-boy-android.aab

      - name: Verify Google Play publishing configuration
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GBB_WIF_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          GBB_PLAY_SERVICE_ACCOUNT: ${{ vars.GCP_SERVICE_ACCOUNT }}
        run: |
          test -n "$GBB_WIF_PROVIDER" || {
            echo "GCP_WORKLOAD_IDENTITY_PROVIDER repository variable is missing" >&2
            exit 1
          }
          test -n "$GBB_PLAY_SERVICE_ACCOUNT" || {
            echo "GCP_SERVICE_ACCOUNT repository variable is missing" >&2
            exit 1
          }

      - name: Authenticate for Google Play publishing
        if: startsWith(github.ref, 'refs/tags/v')
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          project_id: go-bigger-boy
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: Publish signed bundle to Google Play closed track (GBB Beta)
        if: startsWith(github.ref, 'refs/tags/v')
        working-directory: android
        run: |
          for attempt in 1 2 3; do
            if ./gradlew --no-daemon --stacktrace publishBundle \
                --artifact-dir app/build/outputs/bundle/release; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "Google Play upload attempt $attempt failed; retrying."
              sleep $((attempt * 10))
            fi
          done
          exit 1

      - name: Upload debug APK
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: go-bigger-boy-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload signed release packages
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: go-bigger-boy-android
          path: android/release/*
          if-no-files-found: error
          retention-days: 14
