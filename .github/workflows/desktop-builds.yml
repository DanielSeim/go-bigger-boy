name: Desktop builds

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  accuracy:
    name: Accuracy test ROMs
    runs-on: ubuntu-24.04
    env:
      TEST_ROMS_URL: https://github.com/c-sp/game-boy-test-roms/releases/download/v7.0/game-boy-test-roms-v7.0.zip
      TEST_ROMS_SHA256: b9a9d7a1075aa35a3d07c07c34974048672d8520dca9e07a50178f5860c3832c
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Download pinned test ROM bundle
        run: curl --fail --location --retry 3 "$TEST_ROMS_URL" --output test-roms.zip

      - name: Verify test ROM bundle
        run: echo "$TEST_ROMS_SHA256  test-roms.zip" | sha256sum --check -

      - name: Extract test ROM bundle
        run: unzip -q test-roms.zip -d test-roms

      - name: Configure headless accuracy tests
        run: >-
          cmake -S . -B build-accuracy
          -DCMAKE_BUILD_TYPE=Release
          -DGAMEBOY_BUILD_TESTS=ON
          -DGAMEBOY_BUILD_SDL=OFF
          -DGAMEBOY_TEST_ROM_DIR="$PWD/test-roms"

      - name: Build headless test runner
        run: cmake --build build-accuracy --config Release --parallel

      - name: Run accuracy baseline
        run: >-
          ctest --test-dir build-accuracy -C Release
          --label-regex conformance
          --output-on-failure
          --parallel 2

      - name: Upload visual test captures
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: accuracy-visual-results
          path: build-accuracy/visual-results
          if-no-files-found: ignore
          retention-days: 14

  sanitizers:
    name: ASan and UBSan contracts
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Configure sanitizer build
        run: >-
          cmake -S . -B build-sanitize
          -DCMAKE_BUILD_TYPE=RelWithDebInfo
          -DGAMEBOY_BUILD_TESTS=ON
          -DGAMEBOY_BUILD_SDL=OFF
          -DGAMEBOY_ENABLE_SANITIZERS=ON

      - name: Build sanitizer contracts
        run: cmake --build build-sanitize --parallel

      - name: Run sanitizer contracts
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1:strict_string_checks=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: ctest --test-dir build-sanitize --output-on-failure --parallel 2

  thread-sanitizer:
    name: ThreadSanitizer contracts
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Configure ThreadSanitizer build
        run: >-
          cmake -S . -B build-tsan
          -DCMAKE_BUILD_TYPE=RelWithDebInfo
          -DGAMEBOY_BUILD_TESTS=ON
          -DGAMEBOY_BUILD_SDL=OFF
          -DGAMEBOY_ENABLE_THREAD_SANITIZER=ON

      - name: Build ThreadSanitizer contracts
        run: cmake --build build-tsan --parallel

      - name: Run ThreadSanitizer contracts
        env:
          TSAN_OPTIONS: halt_on_error=1:second_deadlock_stack=1
        run: ctest --test-dir build-tsan --output-on-failure --parallel 2

  fuzzers:
    name: libFuzzer parser smoke
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Configure libFuzzer target
        run: >-
          CC=clang CXX=clang++ cmake -S . -B build-fuzz
          -G Ninja
          -DCMAKE_BUILD_TYPE=RelWithDebInfo
          -DGAMEBOY_BUILD_TESTS=OFF
          -DGAMEBOY_BUILD_SDL=OFF
          -DGAMEBOY_BUILD_FUZZERS=ON

      - name: Build libFuzzer target
        run: cmake --build build-fuzz --target gameboy_parser_fuzzers --parallel

      - name: Prepare fuzz artifact directory
        run: mkdir -p fuzz-artifacts

      - name: Run bounded fuzz smoke
        run: >-
          timeout --preserve-status 90s
          ./build-fuzz/gameboy_parser_fuzzers
          tests/fuzz/corpus
          -max_total_time=45
          -max_len=2097152
          -rss_limit_mb=2048
          -artifact_prefix=fuzz-artifacts/
          -print_final_stats=1

      - name: Upload fuzz artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: parser-fuzz-artifacts
          path: fuzz-artifacts
          if-no-files-found: ignore
          retention-days: 14

  build:
    name: ${{ matrix.artifact }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            artifact: go-bigger-boy-linux-x64
            archive: go-bigger-boy-linux-x64.tar.gz
          - runner: windows-2025
            artifact: go-bigger-boy-windows-x64
            archive: go-bigger-boy-windows-x64.zip
          - runner: macos-15
            artifact: go-bigger-boy-macos-arm64
            archive: go-bigger-boy-macos-arm64.tar.gz
          - runner: macos-15-intel
            artifact: go-bigger-boy-macos-x64
            archive: go-bigger-boy-macos-x64.tar.gz

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up SDL3
        id: sdl
        uses: libsdl-org/setup-sdl@afd98199e97f9c2aa739474be7e0886d149a5e47
        with:
          version: 3.4.2
          build-type: Release
          install-linux-dependencies: true
          add-to-environment: true

      - name: Configure
        run: >-
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Release
          -DGAMEBOY_BUILD_TESTS=ON
          -DGAMEBOY_BUILD_SDL=ON
          "-DCMAKE_PREFIX_PATH=${{ steps.sdl.outputs.prefix }}"

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Stage package
        run: cmake --install build --config Release --prefix package

      - name: Sign Windows executable
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          WINDOWS_SIGNING_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_SIGNING_CERTIFICATE_BASE64 }}
          WINDOWS_SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_SIGNING_CERTIFICATE_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_SIGNING_CERTIFICATE_BASE64)) {
            Write-Warning "No Windows signing certificate configured; the executable will be unsigned."
            exit 0
          }
          $certificate = Join-Path $env:RUNNER_TEMP "gbb-signing.pfx"
          [IO.File]::WriteAllBytes(
            $certificate,
            [Convert]::FromBase64String($env:WINDOWS_SIGNING_CERTIFICATE_BASE64))
          $signtool = (Get-Command signtool.exe -ErrorAction SilentlyContinue).Source
          if ([string]::IsNullOrWhiteSpace($signtool)) {
            $signtool = Get-ChildItem `
              "${env:ProgramFiles(x86)}\Windows Kits\10\bin" `
              -Filter signtool.exe -Recurse -ErrorAction SilentlyContinue |
              Sort-Object FullName -Descending |
              Select-Object -First 1 -ExpandProperty FullName
          }
          if ([string]::IsNullOrWhiteSpace($signtool)) {
            throw "signtool.exe was not found on the Windows runner"
          }
          foreach ($file in @("package\gbb.exe", "package\gbb-updater.exe")) {
            & $signtool sign /fd SHA256 /f $certificate `
              /p $env:WINDOWS_SIGNING_CERTIFICATE_PASSWORD `
              /tr http://timestamp.digicert.com /td SHA256 $file
            if ($LASTEXITCODE -ne 0) { throw "Authenticode signing failed for $file" }
            & $signtool verify /pa $file
            if ($LASTEXITCODE -ne 0) { throw "Signed executable verification failed for $file" }
          }

      - name: Package Windows artifact
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path package\* -DestinationPath ${{ matrix.archive }}

      - name: Package Unix artifact
        if: runner.os != 'Windows'
        shell: bash
        run: tar -czf "${{ matrix.archive }}" -C package .

      - name: Upload executable
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.archive }}
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [accuracy, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Download platform archives
        uses: actions/download-artifact@v8
        with:
          pattern: go-bigger-boy-*
          path: release-assets
          merge-multiple: true

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ github.ref_name }}"
          repo="${{ github.repository }}"
          if gh release view "$tag" --repo "$repo" >/dev/null 2>&1; then
            echo "Release $tag already exists; refreshing its assets."
            gh release upload "$tag" release-assets/* --repo "$repo" --clobber
          else
            if gh release create "$tag" release-assets/* \
                --repo "$repo" \
                --verify-tag \
                --generate-notes \
                --title "Go Bigger Boy $tag"; then
              echo "Created release $tag."
            else
              # A concurrent retry may have created the release after the
              # existence check. Refreshing is safe and keeps reruns idempotent.
              echo "Release creation failed; retrying as an asset refresh."
              gh release upload "$tag" release-assets/* --repo "$repo" --clobber
            fi
          fi
