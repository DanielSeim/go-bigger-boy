name: Desktop builds

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: read

jobs:
  accuracy:
    name: Accuracy test ROMs
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      TEST_ROMS_URL: https://github.com/c-sp/game-boy-test-roms/releases/download/v7.0/game-boy-test-roms-v7.0.zip
      TEST_ROMS_SHA256: b9a9d7a1075aa35a3d07c07c34974048672d8520dca9e07a50178f5860c3832c
    steps:
      - name: Check out source
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1

      - name: Download pinned test ROM bundle
        run: curl --fail --location --retry 5 --retry-all-errors --retry-delay 2 --retry-max-time 120 --connect-timeout 20 --max-time 300 "$TEST_ROMS_URL" --output test-roms.zip

      - name: Verify test ROM bundle
        run: echo "$TEST_ROMS_SHA256  test-roms.zip" | sha256sum --check -

      - name: Extract test ROM bundle
        run: unzip -q test-roms.zip -d test-roms

      - name: Configure headless accuracy tests
        run: >-
          cmake -S . -B build-accuracy
          -DCMAKE_BUILD_TYPE=Release
          -DGAMEBOY_BUILD_TESTS=ON
          -DGAMEBOY_BUILD_SDL=OFF
          -DGAMEBOY_TEST_ROM_DIR="$PWD/test-roms"

      - name: Build headless test runner
        run: cmake --build build-accuracy --config Release --parallel

      - name: Run accuracy baseline
        run: >-
          ctest --test-dir build-accuracy -C Release
          --label-regex conformance
          --output-on-failure
          --parallel 2
          --output-junit accuracy-ctest.xml

      - name: Run external DMG/CGB audio reference gate
        if: ${{ hashFiles('tests/fixtures/audio-external/*.txt') != '' }}
        env:
          GBB_AUDIO_REFERENCE_DIR: ${{ github.workspace }}/tests/fixtures/audio-external
          GBB_AUDIO_REQUIRE_EXTERNAL: "1"
        run: >-
          ctest --test-dir build-accuracy -C Release
          --tests-regex gameboy_apu_waveform_contract
          --output-on-failure
          --output-junit audio-ctest.xml

      - name: Upload visual test captures
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: accuracy-visual-results
          path: |
            build-accuracy/visual-results
            accuracy-ctest.xml
            audio-ctest.xml
          if-no-files-found: ignore
          retention-days: 14

  external-suites:
    name: AGE and SameSuite research suites
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      TEST_ROMS_URL: https://github.com/c-sp/game-boy-test-roms/releases/download/v7.0/game-boy-test-roms-v7.0.zip
      TEST_ROMS_SHA256: b9a9d7a1075aa35a3d07c07c34974048672d8520dca9e07a50178f5860c3832c
    steps:
      - name: Check out source
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1

      - name: Download pinned test ROM bundle
        run: curl --fail --location --retry 5 --retry-all-errors --retry-delay 2 --retry-max-time 120 --connect-timeout 20 --max-time 300 "$TEST_ROMS_URL" --output test-roms.zip

      - name: Verify test ROM bundle
        run: echo "$TEST_ROMS_SHA256  test-roms.zip" | sha256sum --check -

      - name: Extract test ROM bundle
        run: unzip -q test-roms.zip -d test-roms

      - name: Configure external suite harness
        run: >-
          cmake -S . -B build-external-suites
          -DCMAKE_BUILD_TYPE=Release
          -DGAMEBOY_BUILD_TESTS=ON
          -DGAMEBOY_BUILD_SDL=OFF
          -DGAMEBOY_TEST_ROM_DIR="$PWD/test-roms"
          -DGAMEBOY_ENABLE_EXTERNAL_SUITES=ON

      - name: Build headless test runner
        run: cmake --build build-external-suites --config Release --target gameboy_test_runner --parallel

      - name: Run external suite research report
        run: >-
          ctest --test-dir build-external-suites -C Release
          --label-regex external-suites
          --output-on-failure
          --output-junit external-ctest.xml

      - name: Upload external suite report
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: external-suite-results
          path: |
            build-external-suites/external-suite-report.md
            build-external-suites/external-suite-captures
            external-ctest.xml
          if-no-files-found: ignore
          retention-days: 14

  plugin-abi:
    name: Plugin ABI (${{ matrix.name }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: gcc
            cc: gcc
            cxx: g++
          - name: clang
            cc: clang
            cxx: clang++
    steps:
      - name: Check out source
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1

      - name: Configure plugin ABI contracts
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        run: >-
          cmake -S . -B build-plugin-abi
          -DCMAKE_BUILD_TYPE=RelWithDebInfo
          -DGAMEBOY_BUILD_TESTS=ON
          -DGAMEBOY_BUILD_SDL=OFF

      - name: Build plugin ABI contracts
        run: >-
          cmake --build build-plugin-abi
          --target gameboy_plugin_abi_header_c_tests
          gameboy_plugin_abi_tests gameboy_plugin_loader_tests
          gameboy_plugin_loader_rejection_tests
          gameboy_plugin_loader_runtime_tests
          gbb_plugin_fixture gbb_plugin_fixture_bad_capability
          gbb_plugin_fixture_missing_callback gbb_plugin_fixture_truncated_table
          gbb_plugin_fixture_bad_frame gbb_plugin_fixture_bad_blob
          gbb_plugin_fixture_create_failure gbb_plugin_fixture_concurrent
          gbb_plugin_fixture_exception gbb_plugin_fixture_allocator_alignment
          gbb_plugin_fixture_no_query gbb_plugin_fixture_bad_utf8
          gbb_plugin_fixture_unterminated_string
          gbb_plugin_fixture_oversized_tables
          --parallel

      - name: Run plugin ABI contracts
        run: >-
          ctest --test-dir build-plugin-abi
          --output-on-failure
          --tests-regex 'gameboy_plugin_(abi|loader)'
          --output-junit plugin-abi-ctest.xml

      - name: Upload plugin ABI diagnostics
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: plugin-abi-results-${{ matrix.name }}
          path: plugin-abi-ctest.xml
          if-no-files-found: ignore
          retention-days: 14

      - name: Build Clang fixture against GCC host
        if: matrix.name == 'gcc'
        run: >-
          clang++ -std=c++17 -fPIC -shared -Iinclude
          -DGBB_PLUGIN_BUILD -DGBB_PLUGIN_FIXTURE_MODE=0
          tests/plugin_fixture/plugin.cpp
          -o build-plugin-abi/libgbb_plugin_fixture_clang.so

      - name: Run mixed-compiler fixture
        if: matrix.name == 'gcc'
        run: |
          ./build-plugin-abi/gameboy_plugin_abi_tests \
            ./build-plugin-abi/libgbb_plugin_fixture_clang.so
          ./build-plugin-abi/gameboy_plugin_loader_tests \
            ./build-plugin-abi/libgbb_plugin_fixture_clang.so

  sanitizers:
    name: ASan and UBSan contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1

      - name: Configure sanitizer build
        run: >-
          cmake -S . -B build-sanitize
          -DCMAKE_BUILD_TYPE=RelWithDebInfo
          -DGAMEBOY_BUILD_TESTS=ON
          -DGAMEBOY_BUILD_SDL=OFF
          -DGAMEBOY_ENABLE_SANITIZERS=ON

      - name: Build sanitizer contracts
        run: cmake --build build-sanitize --parallel

      - name: Run sanitizer contracts
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1:strict_string_checks=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: ctest --test-dir build-sanitize --output-on-failure --parallel 2 --output-junit sanitizer-ctest.xml

      - name: Upload sanitizer diagnostics
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: sanitizer-results
          path: sanitizer-ctest.xml
          if-no-files-found: ignore
          retention-days: 14

  thread-sanitizer:
    name: ThreadSanitizer contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1

      - name: Set up SDL3
        id: sdl
        continue-on-error: true
        uses: libsdl-org/setup-sdl@afd98199e97f9c2aa739474be7e0886d149a5e47
        with:
          version: 3.4.2
          build-type: Release
          install-linux-dependencies: true
          add-to-environment: true

      - name: Retry SDL3 setup
        id: sdl_retry
        if: steps.sdl.outcome == 'failure'
        uses: libsdl-org/setup-sdl@afd98199e97f9c2aa739474be7e0886d149a5e47
        with:
          version: 3.4.2
          build-type: Release
          install-linux-dependencies: true
          add-to-environment: true

      - name: Configure ThreadSanitizer build
        run: >-
          cmake -S . -B build-tsan
          -DCMAKE_BUILD_TYPE=RelWithDebInfo
          -DGAMEBOY_BUILD_TESTS=ON
          -DGAMEBOY_BUILD_SDL=ON
          "-DCMAKE_PREFIX_PATH=${{ steps.sdl_retry.outputs.prefix || steps.sdl.outputs.prefix }}"
          -DGAMEBOY_ENABLE_THREAD_SANITIZER=ON

      - name: Build ThreadSanitizer contracts
        run: cmake --build build-tsan --parallel

      - name: Run ThreadSanitizer contracts
        env:
          TSAN_OPTIONS: halt_on_error=1:second_deadlock_stack=1:history_size=7
        run: ctest --test-dir build-tsan --output-on-failure --parallel 2 --output-junit tsan-ctest.xml

      - name: Install X11 input driver for GUI smoke
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y xdotool

      - name: Prepare debugger smoke ROM
        run: |
          python3 - <<'PY'
          from pathlib import Path

          rom = bytearray(0x8000)
          # A tiny ROM-only cartridge that loops after the post-boot entry
          # point. It is sufficient to exercise the desktop debugger without
          # committing copyrighted test artwork to the repository.
          rom[0x100:0x104] = b"\x00\xC3\x00\x01"
          rom[0x147] = 0x00
          rom[0x148] = 0x00
          rom[0x149] = 0x00
          Path("tsan-gui-artifacts/smoke.gb").parent.mkdir(parents=True,
                                                             exist_ok=True)
          Path("tsan-gui-artifacts/smoke.gb").write_bytes(rom)
          PY

      - name: Run bounded SDL frontend and debugger smoke under Xvfb
        env:
          SDL_AUDIODRIVER: dummy
          SDL_VIDEODRIVER: x11
          SDL_RENDER_DRIVER: software
          WAYLAND_DISPLAY: ""
          TSAN_OPTIONS: halt_on_error=1:second_deadlock_stack=1:history_size=7
        run: |
          for attempt in 1 2 3; do
            rm -rf tsan-gui-artifacts/debugger-captures
            if bash tests/sdl_tsan_smoke.sh ./build-tsan/gbb \
                tsan-gui-artifacts/smoke.gb && \
               python3 tests/check_desktop_debugger_captures.py \
                tsan-gui-artifacts/debugger-captures; then
              exit 0
            fi
            echo "debugger visual smoke attempt ${attempt} failed; retrying"
          done
          exit 1

      - name: Upload interactive SDL TSan artifacts
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: tsan-gui-artifacts
          path: |
            tsan-gui-artifacts
            tsan-ctest.xml
          if-no-files-found: ignore
          retention-days: 14

  fuzzers:
    name: libFuzzer parser smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1

      - name: Configure libFuzzer target
        run: >-
          CC=clang CXX=clang++ cmake -S . -B build-fuzz
          -G Ninja
          -DCMAKE_BUILD_TYPE=RelWithDebInfo
          -DGAMEBOY_BUILD_TESTS=OFF
          -DGAMEBOY_BUILD_SDL=OFF
          -DGAMEBOY_BUILD_FUZZERS=ON

      - name: Build libFuzzer target
        run: cmake --build build-fuzz --target gameboy_parser_fuzzers gameboy_parser_review --parallel

      - name: Prepare fuzz artifact directory
        run: mkdir -p fuzz-artifacts

      - name: Validate reviewed fuzz corpus
        run: bash tests/fuzz/check_corpus.sh

      - name: Run bounded fuzz smoke
        run: >-
          timeout --preserve-status 90s
          ./build-fuzz/gameboy_parser_fuzzers
          tests/fuzz/corpus
          -max_total_time=45
          -max_len=2097152
          -rss_limit_mb=2048
          -artifact_prefix=fuzz-artifacts/
          -print_final_stats=1

      - name: Record semantic review report
        if: always()
        run: >-
          export REVIEWER=./build-fuzz/gameboy_parser_review;
          if [[ -d fuzz-corpus-run ]]; then
            bash tests/fuzz/review_corpus.sh fuzz-corpus-run fuzz-artifacts/semantic-review.tsv;
          else
            bash tests/fuzz/review_corpus.sh tests/fuzz/corpus fuzz-artifacts/semantic-review.tsv;
          fi

      - name: Upload fuzz artifacts
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: parser-fuzz-artifacts
          path: fuzz-artifacts
          if-no-files-found: ignore
          retention-days: 14

  build:
    name: ${{ matrix.artifact }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            artifact: go-bigger-boy-linux-x64
            archive: go-bigger-boy-linux-x64.AppImage
          - runner: windows-2025
            artifact: go-bigger-boy-windows-x64
            archive: go-bigger-boy-windows-x64.zip
          - runner: macos-15
            artifact: go-bigger-boy-macos-arm64
            archive: go-bigger-boy-macos-arm64.tar.gz
          - runner: macos-15-intel
            artifact: go-bigger-boy-macos-x64
            archive: go-bigger-boy-macos-x64.tar.gz

    steps:
      - name: Check out source
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1

      - name: Set up SDL3
        id: sdl
        continue-on-error: true
        uses: libsdl-org/setup-sdl@afd98199e97f9c2aa739474be7e0886d149a5e47
        with:
          version: 3.4.2
          build-type: Release
          install-linux-dependencies: true
          add-to-environment: true

      - name: Retry SDL3 setup
        id: sdl_retry
        if: steps.sdl.outcome == 'failure'
        uses: libsdl-org/setup-sdl@afd98199e97f9c2aa739474be7e0886d149a5e47
        with:
          version: 3.4.2
          build-type: Release
          install-linux-dependencies: true
          add-to-environment: true

      - name: Configure
        run: >-
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Release
          -DGAMEBOY_BUILD_TESTS=ON
          -DGAMEBOY_BUILD_SDL=ON
          "-DCMAKE_PREFIX_PATH=${{ steps.sdl_retry.outputs.prefix || steps.sdl.outputs.prefix }}"

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Test (Linux)
        if: runner.os == 'Linux'
        env:
          GBB_LINK_FAULT_TRACE_DIR: ${{ github.workspace }}/build/link-fault-traces
        run: >-
          ctest --test-dir build -C Release --output-on-failure
          --output-junit ctest-results.xml

      - name: Test (Windows and macOS)
        if: runner.os != 'Linux'
        env:
          GBB_LINK_FAULT_TRACE_DIR: ${{ github.workspace }}/build/link-fault-traces
        run: >-
          ctest --test-dir build -C Release --output-on-failure
          --exclude-regex '^gameboy_serial_link_contract$'
          --output-junit ctest-results.xml

      - name: Upload desktop test diagnostics
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: desktop-test-results-${{ matrix.artifact }}
          path: |
            ctest-results.xml
            build/link-fault-traces
          if-no-files-found: ignore
          retention-days: 14

      - name: Stage Linux AppDir
        if: runner.os == 'Linux'
        shell: bash
        run: |
          rm -rf package
          DESTDIR="$PWD/package" cmake --install build --config Release --prefix /usr

      - name: Stage package
        if: runner.os != 'Linux'
        run: cmake --install build --config Release --prefix package

      - name: Sign Windows executable
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          WINDOWS_SIGNING_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_SIGNING_CERTIFICATE_BASE64 }}
          WINDOWS_SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_SIGNING_CERTIFICATE_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_SIGNING_CERTIFICATE_BASE64)) {
            Write-Warning "No Windows signing certificate configured; the executable will be unsigned."
            exit 0
          }
          $certificate = Join-Path $env:RUNNER_TEMP "gbb-signing.pfx"
          [IO.File]::WriteAllBytes(
            $certificate,
            [Convert]::FromBase64String($env:WINDOWS_SIGNING_CERTIFICATE_BASE64))
          $signtool = (Get-Command signtool.exe -ErrorAction SilentlyContinue).Source
          if ([string]::IsNullOrWhiteSpace($signtool)) {
            $signtool = Get-ChildItem `
              "${env:ProgramFiles(x86)}\Windows Kits\10\bin" `
              -Filter signtool.exe -Recurse -ErrorAction SilentlyContinue |
              Sort-Object FullName -Descending |
              Select-Object -First 1 -ExpandProperty FullName
          }
          if ([string]::IsNullOrWhiteSpace($signtool)) {
            throw "signtool.exe was not found on the Windows runner"
          }
          foreach ($file in @("package\gbb.exe", "package\gbb-updater.exe")) {
            & $signtool sign /fd SHA256 /f $certificate `
              /p $env:WINDOWS_SIGNING_CERTIFICATE_PASSWORD `
              /tr http://timestamp.digicert.com /td SHA256 $file
            if ($LASTEXITCODE -ne 0) { throw "Authenticode signing failed for $file" }
            & $signtool verify /pa $file
            if ($LASTEXITCODE -ne 0) { throw "Signed executable verification failed for $file" }
          }

      - name: Package Windows artifact
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path package\* -DestinationPath ${{ matrix.archive }}

      - name: Package Linux AppImage
        if: runner.os == 'Linux'
        shell: bash
        run: bash scripts/build-appimage.sh package "${{ matrix.archive }}"

      - name: Package macOS artifact
        if: runner.os == 'macOS'
        shell: bash
        run: tar -czf "${{ matrix.archive }}" -C package .

      - name: Upload executable
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.archive }}
          if-no-files-found: error
          retention-days: 14
