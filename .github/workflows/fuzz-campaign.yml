name: Parser fuzz campaign

on:
  schedule:
    - cron: '17 3 * * 0'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  libfuzzer:
    name: Scheduled libFuzzer campaign
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Configure libFuzzer target
        run: >-
          CC=clang CXX=clang++ cmake -S . -B build-fuzz
          -G Ninja
          -DCMAKE_BUILD_TYPE=RelWithDebInfo
          -DGAMEBOY_BUILD_TESTS=OFF
          -DGAMEBOY_BUILD_SDL=OFF
          -DGAMEBOY_BUILD_FUZZERS=ON

      - name: Build libFuzzer target
        run: cmake --build build-fuzz --target gameboy_parser_fuzzers gameboy_parser_review --parallel

      - name: Validate reviewed fuzz corpus
        run: bash tests/fuzz/check_corpus.sh

      - name: Run thirty-minute campaign
        env:
          FUZZER: ./build-fuzz/gameboy_parser_fuzzers
          FUZZ_CAMPAIGN_SECONDS: 1800
        run: bash tests/fuzz/run_campaign.sh

      - name: Record semantic review report
        if: always()
        run: >-
          if [[ -d fuzz-corpus-run ]]; then
            export REVIEWER=./build-fuzz/gameboy_parser_review
            bash tests/fuzz/review_corpus.sh fuzz-corpus-run fuzz-artifacts/semantic-review.tsv
          fi

      - name: Upload campaign corpus and crashes
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: parser-fuzz-campaign-${{ github.run_id }}
          path: |
            fuzz-corpus-run
            fuzz-artifacts
          if-no-files-found: ignore
          retention-days: 30
