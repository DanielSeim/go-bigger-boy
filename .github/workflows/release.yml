name: Publish release

on:
  workflow_run:
    workflows:
      - Desktop builds
    types: [completed]
  workflow_dispatch:
    inputs:
      tag:
        description: "Validated version tag to publish"
        required: true
        type: string
      sha:
        description: "Exact commit SHA used by the tagged platform builds"
        required: true
        type: string

permissions:
  actions: read
  contents: write

concurrency:
  group: release-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false

env:
  GH_TOKEN: ${{ github.token }}
  REPOSITORY: ${{ github.repository }}
  TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.event.workflow_run.head_branch }}
  TAG_SHA: ${{ github.event_name == 'workflow_dispatch' && inputs.sha || github.event.workflow_run.head_sha }}

jobs:
  publish:
    name: Publish tagged desktop and Android artifacts
    if: >-
      (github.event_name == 'workflow_dispatch' &&
       startsWith(inputs.tag, 'v') && contains(inputs.tag, '.') &&
       inputs.sha != '') ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.event == 'push' &&
       startsWith(github.event.workflow_run.head_branch, 'v') &&
       contains(github.event.workflow_run.head_branch, '.'))
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Check out validated source
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          ref: ${{ env.TAG_SHA }}

      - name: Wait for platform workflows
        id: workflows
        shell: bash
        run: |
          set -euo pipefail

          find_run() {
            local workflow="$1"
            local response
            for retry in 1 2 3; do
              if response="$(gh run list \
                  --repo "$REPOSITORY" \
                  --workflow "$workflow" \
                  --limit 100 \
                  --json databaseId,status,conclusion,headBranch,headSha,url)"; then
                printf '%s' "$response" | python3 -c '
          import json
          import sys

          tag, sha = sys.argv[1:]
          runs = json.load(sys.stdin)
          matches = [
              run for run in runs
              if run.get("headBranch") == tag and run.get("headSha") == sha
          ]
          matches.sort(key=lambda run: run.get("databaseId", 0), reverse=True)
          if matches:
              run = matches[0]
              print("|".join(str(run.get(key, "")) for key in
                              ("databaseId", "status", "conclusion", "url")))
          ' "$TAG" "$TAG_SHA"
                return 0
              fi
              echo "GitHub API lookup for $workflow failed; retry $retry/3." >&2
              sleep $((retry * 5))
            done
            return 1
          }

          for attempt in $(seq 1 90); do
            desktop="$(find_run 'Desktop builds' || true)"
            android="$(find_run 'Android build' || true)"
            web="$(find_run 'Web build and Pages' || true)"
            if [[ -z "$desktop" || -z "$android" || -z "$web" ]]; then
              echo "Waiting for Desktop, Android, and Web builds for $TAG ($attempt/90)."
              sleep 20
              continue
            fi

            IFS='|' read -r desktop_id desktop_status desktop_conclusion desktop_url <<< "$desktop"
            IFS='|' read -r android_id android_status android_conclusion android_url <<< "$android"
            IFS='|' read -r web_id web_status web_conclusion web_url <<< "$web"
            if [[ "$desktop_status" == completed && "$desktop_conclusion" != success ]]; then
              echo "Desktop workflow failed: $desktop_url" >&2
              exit 1
            fi
            if [[ "$android_status" == completed && "$android_conclusion" != success ]]; then
              echo "Android workflow failed: $android_url" >&2
              exit 1
            fi
            if [[ "$web_status" == completed && "$web_conclusion" != success ]]; then
              echo "Web workflow failed: $web_url" >&2
              exit 1
            fi
            if [[ "$desktop_status" == completed && "$android_status" == completed &&
                  "$web_status" == completed ]]; then
              echo "desktop_run=$desktop_id" >> "$GITHUB_OUTPUT"
              echo "android_run=$android_id" >> "$GITHUB_OUTPUT"
              echo "web_run=$web_id" >> "$GITHUB_OUTPUT"
              echo "Desktop, Android, and Web workflows succeeded for $TAG."
              exit 0
            fi
            echo "Desktop: $desktop_status; Android: $android_status; Web: $web_status ($attempt/90)."
            sleep 20
          done
          echo "Timed out waiting for Desktop, Android, and Web workflows for $TAG." >&2
          exit 1

      - name: Download release artifacts
        shell: bash
        env:
          DESKTOP_RUN: ${{ steps.workflows.outputs.desktop_run }}
          ANDROID_RUN: ${{ steps.workflows.outputs.android_run }}
          WEB_RUN: ${{ steps.workflows.outputs.web_run }}
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            rm -rf release-assets
            mkdir -p release-assets/desktop release-assets/android release-assets/web
            if gh run download "$DESKTOP_RUN" \
                --repo "$REPOSITORY" \
                --pattern 'go-bigger-boy-*' \
                --dir release-assets/desktop \
              && gh run download "$ANDROID_RUN" \
                --repo "$REPOSITORY" \
                --name go-bigger-boy-android \
                --dir release-assets/android \
              && gh run download "$WEB_RUN" \
                --repo "$REPOSITORY" \
                --name go-bigger-boy-web \
                --dir release-assets/web \
              && find release-assets -type f -print -quit | grep -q .; then
              exit 0
            fi
            echo "Artifact download attempt $attempt failed; retrying." >&2
            sleep $((attempt * 10))
          done
          echo "Unable to download release artifacts." >&2
          exit 1

      - name: Run release asset preflight
        run: bash scripts/verify-release-assets.sh release-assets

      - name: Publish release assets
        shell: bash
        run: |
          set -euo pipefail
          mapfile -d '' assets < <(find release-assets -type f -print0 | sort -z)
          if [[ "${#assets[@]}" -eq 0 ]]; then
            echo "No release assets were downloaded." >&2
            exit 1
          fi

          for attempt in 1 2 3; do
            if gh release view "$TAG" --repo "$REPOSITORY" >/dev/null 2>&1; then
              gh release upload "$TAG" "${assets[@]}" \
                --repo "$REPOSITORY" --clobber && exit 0
            elif gh release create "$TAG" "${assets[@]}" \
                --repo "$REPOSITORY" \
                --verify-tag \
                --generate-notes \
                --title "Go Bigger Boy $TAG"; then
              exit 0
            fi
            echo "Release publication attempt $attempt failed; retrying." >&2
            sleep $((attempt * 10))
          done
          echo "Unable to publish release $TAG." >&2
          exit 1

  publish-play:
    name: Publish Android bundle and release news to Google Play
    needs: publish
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out validated source
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          ref: ${{ env.TAG_SHA }}

      - name: Verify Google Play publishing configuration
        env:
          GBB_WIF_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          GBB_PLAY_SERVICE_ACCOUNT: ${{ vars.GCP_SERVICE_ACCOUNT }}
        run: |
          test -n "$GBB_WIF_PROVIDER" || {
            echo "GCP_WORKLOAD_IDENTITY_PROVIDER repository variable is missing" >&2
            exit 1
          }
          test -n "$GBB_PLAY_SERVICE_ACCOUNT" || {
            echo "GCP_SERVICE_ACCOUNT repository variable is missing" >&2
            exit 1
          }

      - name: Download published bundle and release description
        run: |
          set -euo pipefail
          mkdir -p android/play-artifacts
          gh release download "$TAG" --repo "$REPOSITORY" \
            --pattern go-bigger-boy-android.aab --dir android/play-artifacts
          gh api "repos/$REPOSITORY/releases/tags/$TAG" > play-release.json
          python3 scripts/prepare_play_release_notes.py play-release.json \
            android/app/src/main/play/release-notes/en-US/default.txt
          {
            echo '### Google Play update news (en-US)'
            echo
            cat android/app/src/main/play/release-notes/en-US/default.txt
            echo
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Set up Java
        uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165 # v5.0.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@f236b35da9d031e13b1005234ebe4392ed54c580 # v5.0.0

      - name: Set up Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1
        with:
          packages: platform-tools platforms;android-36 build-tools;35.0.0

      - name: Authenticate for Google Play publishing
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          project_id: go-bigger-boy
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: Publish signed bundle to Google Play closed track (GBB Beta)
        working-directory: android
        run: |
          for attempt in 1 2 3; do
            if ./gradlew --no-daemon --stacktrace publishBundle \
                --artifact-dir play-artifacts; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "Google Play upload attempt $attempt failed; retrying."
              sleep $((attempt * 10))
            fi
          done
          exit 1
